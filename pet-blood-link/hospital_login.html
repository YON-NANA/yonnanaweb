<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動物病院ログイン - AnimalBloodConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'life-red': '#D32F2F', /* Logo Red */
                        'life-green': '#2E7D32', /* Logo Green */
                        'trust-blue': '#1565C0', /* Logo Blue */
                        'deep-blue': '#1D3557',
                        'warm-gray': '#F8F9FA'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F1FAEE;
        }
    </style>
</head>

<body class="h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 md:p-10">
        <div class="text-center mb-8">
            <div class="flex justify-center mb-4">
                <img src="assets/logo.png" alt="AnimalBloodConnect" class="h-16 w-auto">
            </div>
            <h1 class="text-2xl font-bold mb-2">
                <span class="text-life-green">Animal</span><span class="text-life-red">Blood</span><span
                    class="text-trust-blue">Connect</span>
            </h1>
            <p class="text-gray-500 font-medium">動物病院専用ログイン</p>
        </div>

        <form action="hospital_dashboard.html" method="GET">
            <div class="mb-6">
                <label class="block text-gray-700 font-bold mb-2">病院ID</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                            </path>
                        </svg>
                    </span>
                    <input type="text" placeholder="H-12345"
                        class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-trust-blue focus:border-transparent transition"
                        required>
                </div>
            </div>

            <div class="mb-8">
                <label class="block text-gray-700 font-bold mb-2">パスワード</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                            </path>
                        </svg>
                    </span>
                    <input type="password" placeholder="••••••••"
                        class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-trust-blue focus:border-transparent transition"
                        required>
                </div>
            </div>

            <button type="submit"
                class="w-full bg-trust-blue text-white font-bold text-lg py-3 rounded-lg shadow-lg hover:bg-blue-600 transition duration-200">
                ログイン
            </button>
        </form>

        <div class="mt-8 text-center border-t border-gray-100 pt-6">
            <p class="text-sm text-gray-500 mb-2">まだアカウントをお持ちでない場合</p>
            <a href="hospital_inquiry.html" class="text-trust-blue font-bold hover:underline">
                利用申請・お問い合わせはこちら
            </a>
            <p class="text-xs text-gray-400 mt-4">
                ※本サービスは事前の審査・承認を受けた動物病院のみご利用いただけます。
            </p>
        </div>
    </div>

</body>

</html>
