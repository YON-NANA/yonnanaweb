    /* Home-specific styles */
    .hero-section {
      min-height: calc(100vh - var(--nav-height));
      display: flex;
      align-items: center;
      padding: var(--space-3xl) 0;
      position: relative;
      overflow: hidden;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3xl);
      align-items: center;
    }

    .hero-map-preview {
      position: relative;
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-lg), var(--shadow-green);
      border: 1px solid var(--glass-border);
      height: 420px;
    }

    #heroMap { height: 100%; }

    .hero-map-overlay {
      position: absolute;
      top: var(--space-md);
      left: var(--space-md);
      right: var(--space-md);
      z-index: 400;
      display: flex;
      gap: var(--space-sm);
    }

    .map-badge {
      padding: 4px 10px;
      background: rgba(8,15,26,0.85);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      font-size: 0.7rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .map-badge.lost  { color: var(--lost); }
    .map-badge.found { color: var(--found); }
    .map-badge.govt  { color: var(--gold); }

    .cta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-md);
      margin-top: var(--space-3xl);
    }

    .cta-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      text-align: center;
      text-decoration: none;
      transition: all var(--transition-normal);
      cursor: pointer;
      display: block;
    }

    .cta-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-md);
    }

    .cta-card.lost-card:hover  { border-color: rgba(255,107,53,0.4); background: rgba(255,107,53,0.05); }
    .cta-card.found-card:hover { border-color: rgba(46,204,113,0.4); background: rgba(46,204,113,0.05); }
    .cta-card.witness-card:hover { border-color: rgba(52,152,219,0.4); background: rgba(52,152,219,0.05); }

    .cta-icon {
      width: 64px; height: 64px;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto var(--space-md);
    }

    .icon-lost    { background: rgba(255,107,53,0.15); }
    .icon-found   { background: rgba(46,204,113,0.15); }
    .icon-witness { background: rgba(52,152,219,0.15); }

    .stats-bar {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: var(--space-xl) var(--space-2xl);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-xl);
      margin: var(--space-3xl) 0;
      text-align: center;
    }

    .stat-divider {
      width: 1px;
      background: var(--border);
      margin: 0 var(--space-xl);
    }

    .stat-num {
      font-size: 2.5rem;
      font-weight: 900;
      font-family: var(--font-en);
      color: var(--gold);
      line-height: 1;
      margin-bottom: var(--space-xs);
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .recent-section {
      padding: var(--space-3xl) 0;
    }

    .section-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-xl);
    }

    .pet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: var(--space-lg);
    }

    .how-it-works {
      padding: var(--space-3xl) 0;
      position: relative;
    }

    .steps-visual {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-xl);
      position: relative;
    }

    .steps-visual::before {
      content: '';
      position: absolute;
      top: 32px;
      left: 10%;
      right: 10%;
      height: 2px;
      background: linear-gradient(90deg, var(--primary-light), var(--gold), var(--found));
      z-index: 0;
    }

    .how-step {
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .how-step-num {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: var(--bg-dark);
      border: 2px solid var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-md);
      font-size: 1.5rem;
      position: relative;
    }

    .how-step-num::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: rgba(26,92,58,0.1);
    }

    .alert-banner {
      background: linear-gradient(135deg, rgba(255,107,53,0.1), rgba(201,168,76,0.1));
      border: 1px solid rgba(255,107,53,0.25);
      border-radius: var(--radius-lg);
      padding: var(--space-lg) var(--space-xl);
      display: flex;
      align-items: center;
      gap: var(--space-lg);
      margin-bottom: var(--space-xl);
      animation: fadeInUp 0.5s ease;
    }

    .alert-banner-icon {
      font-size: 2rem;
      flex-shrink: 0;
    }

    .govt-banner {
      background: linear-gradient(135deg, rgba(26,92,58,0.15) 0%, rgba(201,168,76,0.08) 100%);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: var(--radius-xl);
      padding: var(--space-2xl);
      display: flex;
      align-items: center;
      gap: var(--space-2xl);
      margin-top: var(--space-3xl);
    }

    .partner-logos {
      display: flex;
      gap: var(--space-md);
      flex-wrap: wrap;
      align-items: center;
    }

    .partner-logo-pill {
      padding: 6px 16px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .floating-alert {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 900;
      max-width: 340px;
      background: var(--bg-card);
      border: 1px solid rgba(155,89,182,0.3);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      backdrop-filter: var(--glass-blur);
      box-shadow: var(--shadow-md);
      animation: slideInLeft 0.4s ease 3s both;
    }

    @keyframes slideInLeft {
      from { transform: translateX(-120%); opacity: 0; }
      to   { transform: translateX(0); opacity: 1; }
    }

    footer {
      padding: var(--space-2xl) 0;
      border-top: 1px solid var(--border);
      margin-top: var(--space-3xl);
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: var(--space-2xl);
      margin-bottom: var(--space-xl);
    }

    .footer-links a {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      padding: 4px 0;
      transition: color var(--transition-fast);
    }
    .footer-links a:hover { color: var(--text-primary); }
    .footer-links h4 {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: var(--space-sm);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    @media (max-width: 900px) {
      .hero-grid { grid-template-columns: 1fr; }
      .hero-map-preview { height: 300px; }
      .cta-grid { grid-template-columns: 1fr; }
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .steps-visual { grid-template-columns: repeat(2, 1fr); }
      .steps-visual::before { display: none; }
      .footer-grid { grid-template-columns: 1fr 1fr; }
      .govt-banner { flex-direction: column; }
    }

    @media (max-width: 600px) {
      .stats-bar { grid-template-columns: 1fr 1fr; padding: var(--space-lg); }
      .steps-visual { grid-template-columns: 1fr; }
    }
  </style>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const D = window.MOCK_DATA;

  // 笏笏笏 Hero Map 笏笏笏
  const heroMap = L.map('heroMap', {
    center: [35.6812, 139.7671],
    zoom: 13,
    zoomControl: false,
    dragging: false,
    scrollWheelZoom: false,
    doubleClickZoom: false
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '', maxZoom: 19
  }).addTo(heroMap);

  // Plot markers
  D.lost.forEach(p => {
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:12px;height:12px;background:var(--lost);border-radius:50%;border:2px solid white;box-shadow:0 0 8px rgba(255,107,53,0.6);"></div>`,
      iconSize: [12,12], iconAnchor: [6,6]
    });
    L.marker([p.location.lat, p.location.lng], { icon })
      .addTo(heroMap)
      .bindPopup(`<strong>${p.name}</strong><br>${p.breed}`);
  });

  D.found.forEach(p => {
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:12px;height:12px;background:var(--found);border-radius:50%;border:2px solid white;box-shadow:0 0 8px rgba(46,204,113,0.6);"></div>`,
      iconSize: [12,12], iconAnchor: [6,6]
    });
    L.marker([p.location.lat, p.location.lng], { icon }).addTo(heroMap);
  });

  D.govtData.forEach(p => {
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:10px;height:10px;background:var(--gold);border-radius:50%;border:2px solid white;box-shadow:0 0 8px rgba(201,168,76,0.6);"></div>`,
      iconSize: [10,10], iconAnchor: [5,5]
    });
    L.marker([35.6812 + (Math.random()-0.5)*0.04, 139.7671 + (Math.random()-0.5)*0.05], { icon }).addTo(heroMap);
  });

  // 笏笏笏 Lost Cards 笏笏笏
  const grid = document.getElementById('lostGrid');
  D.lost.slice(0, 4).forEach(p => {
    grid.innerHTML += `
      <a href="map.html?id=${p.id}" class="pet-card" data-animal="${p.animal}">
        <div class="pet-card-image">
          <img src="${p.photo}" alt="${p.name}" loading="lazy">
          <span class="pet-card-badge badge-lost">霑ｷ蟄・/span>
          <span class="pet-card-days">${D.daysAgo(p.lostAt)}</span>
        </div>
        <div class="pet-card-body">
          <div class="pet-card-name">${p.name} <span class="text-sm text-muted">${p.breed}</span></div>
          <div class="pet-card-meta">
            ${p.colors.map(c=>`<span class="pet-tag">${c}</span>`).join('')}
            ${p.features.slice(0,2).map(f=>`<span class="pet-tag">${f}</span>`).join('')}
          </div>
          <div class="pet-card-location">
            <i class="fas fa-map-marker-alt" style="color:var(--lost)"></i>
            ${p.location.name}
          </div>
        </div>
        <div class="pet-card-footer">
          <span class="status-pill pill-lost">謐懃ｴ｢荳ｭ</span>
          <span class="text-xs text-muted"><i class="fas fa-eye"></i> ${p.views}</span>
        </div>
      </a>
    `;
  });

  // 笏笏笏 Match Preview 笏笏笏
  const matchDiv = document.getElementById('matchPreviewCards');
  const matches = [
    { lost: D.lost[1], found: D.found[0], score: 92 },
    { lost: D.lost[2], found: D.found[1], score: 88 }
  ];

  matches.forEach(m => {
    matchDiv.innerHTML += `
      <div class="card" style="padding:var(--space-md);">
        <div style="display:flex;align-items:center;gap:var(--space-md);">
          <img src="${m.lost.photo}" style="width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid var(--lost);" alt="${m.lost.name}">
          <div style="font-size:1.2rem;color:var(--text-muted);">筺ｷ</div>
          <img src="${m.found.photo}" style="width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid var(--found);" alt="菫晁ｭｷ迪ｫ">
          <div style="flex:1;">
            <div class="match-score high" style="margin-bottom:4px;">荳閾ｴ邇・${m.score}%</div>
            <div class="text-sm text-secondary">${m.lost.name} ﾃ・菫晁ｭｷ蝣ｱ蜻・#${m.found.id}</div>
          </div>
        </div>
      </div>
    `;
  });
});
</script>
