<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>【緊急】HRRデータ全救出ツール</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f0f7ff; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; border-top: 5px solid #ff4444; }
        button { background: #ff4444; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #cc0000; transform: scale(1.05); }
        .msg { margin-bottom: 25px; color: #444; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚨 データ救出を実行します</h1>
        <p class="msg">
            ブラウザの奥底(localStorage)に眠っている<br>
            <b>「すべてのデータ(hrr_system_v2)」</b>を<br>
            1つのファイルとして取り出します。
        </p>
        <button onclick="saveAllData()">📥 全データをファイルに取出す</button>
        <div id="status" style="margin-top:20px; font-weight:bold; color:#2E7D32;"></div>
    </div>

    <script>
        function saveAllData() {
            const data = localStorage.getItem('hrr_system_v2');
            if(!data) {
                alert('データが見つかりませんでした。このブラウザには保存されていないようです。');
                return;
            }
            
            // JSONであることを確認して整形(見やすくする)
            let formatted;
            try {
                formatted = JSON.stringify(JSON.parse(data), null, 2);
            } catch(e) {
                formatted = data; // 壊れていてもそのまま出す
            }

            const blob = new Blob([formatted], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            const now = new Date().toISOString().split('T')[0];
            link.download = `HRR_RESCUE_ALL_DATA_${now}.json`;
            link.click();
            
            document.getElementById('status').innerText = '✅ ファイルをダウンロードしました！\nこのファイルをindex.htmlで読み込んでください。';
            alert('「HRR_RESCUE_ALL_DATA_...」というファイルを保存しました。');
        }
    </script>
</body>
</html>
