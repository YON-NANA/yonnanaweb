<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRR 発送・請求・作業管理システム - ヨンナナ</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #2196F3;
            --primary-light: #E3F2FD;
            --secondary: #66BB6A;
            --accent: #FF9800;
            --danger: #EF5350;
            --text-main: #2C3E50;
            --text-sub: #7F8C8D;
            --bg-body: #F4F7F9;
            --bg-sidebar: #FFFFFF;
            --border-color: #DDE1E6;
            --sidebar-width: 260px;
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 100;
            overflow-y: auto;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .header {
            height: 70px;
            background: #fff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 30px;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .content-area {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .brand {
            padding: 30px;
            font-weight: 800;
            font-size: 24px;
            color: var(--primary);
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-list {
            list-style: none;
            padding: 20px 0;
        }

        .nav-item {
            padding: 14px 24px;
            cursor: pointer;
            color: var(--text-sub);
            transition: all 0.2s;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 4px 12px;
            border-radius: 10px;
        }

        .nav-item:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .nav-item.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-secondary {
            background: var(--secondary);
            color: #fff;
        }

        .btn-outline {
            background: #fff;
            border: 1.5px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
        }

        h2 {
            font-size: 19px;
            margin-bottom: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2::before {
            content: "";
            width: 4px;
            height: 18px;
            background: var(--primary);
            border-radius: 2px;
        }

        .table-container {
            background: #fff;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-bottom: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #F8FAFC;
            padding: 14px;
            text-align: left;
            border-bottom: 2px solid var(--border-color);
            color: var(--text-sub);
            font-size: 12px;
            font-weight: 700;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        tr:hover {
            background: #F9FBFF;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .badge-paid {
            background: #E8F5E9;
            color: #2E7D32;
        }

        .badge-unpaid {
            background: #FFEBEE;
            color: #C62828;
        }

        .badge-warning {
            background: #FFF3E0;
            color: #E65100;
            border: 1px solid #FFE0B2;
        }

        .badge-expired {
            background: #F5F5F5;
            color: #616161;
        }

        .badge-warning {
            background: #FFF3E0;
            color: #E65100;
            border: 1px solid #FFB74D;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-sub);
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #fff;
            border-radius: 20px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 40px;
            transform: scale(0.9);
            transition: 0.3s;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-overlay.open .modal {
            transform: scale(1);
        }

        .close-btn {
            cursor: pointer;
            font-size: 24px;
            float: right;
        }

        /* タイムライン用のスタイル */
        .timeline-grid {
            display: flex;
            gap: 2px;
            margin-top: 5px;
        }

        .timeline-block {
            width: 18px;
            height: 18px;
            border-radius: 3px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .block-spring {
            background: #FF69B4;
        }

        /* ピンク */
        .block-summer {
            background: #32CD32;
        }

        /* 緑 */
        .block-autumn {
            background: #FF8C00;
        }

        /* 橙 */
        .block-winter {
            background: #8B4513;
        }

        /* 茶 */
        .block-empty {
            background: #eeeff1;
            border: 1px solid #dfe3e8;
        }

        .timeline-container {
            overflow-x: auto;
            max-width: 600px;
            padding-bottom: 5px;
        }

        .timeline-year-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            border-left: 1px solid #ddd;
            padding: 0 2px;
        }

        .year-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 2px;
        }

        .season-blocks {
            display: flex;
            gap: 2px;
        }

        .current-vol-marker {
            border: 2px solid #2196F3 !important;
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 0 5px rgba(33, 150, 243, 0.5);
        }

        @media print {

            .sidebar,
            .header,
            .modal-overlay,
            .no-print {
                display: none !important;
            }

            body {
                background: #fff;
                display: block;
                height: auto;
                overflow: visible;
            }

            .main-content {
                display: block;
                overflow: visible;
            }

            .content-area {
                padding: 0;
                overflow: visible;
            }

            /* 請求書印刷時はモーダル内容を全面表示 */
            .invoice-print-area {
                display: block !important;
                position: static !important;
            }
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="brand">HRR / ヨンナナ</div>
        <ul class="nav-list">
            <li class="nav-item" onclick="app.navigate('dashboard')">🏠 ダッシュボード</li>
            <li class="nav-item" onclick="app.navigate('supporters')">👥 サポーター管理</li>
            <li class="nav-item" onclick="app.navigate('advertisers')">💼 広告主管理</li>
            <li class="nav-item" onclick="app.navigate('contributors')">✍️ 寄稿者管理</li>
            <li class="nav-item" onclick="app.navigate('donors')">🎁 支援者管理</li>
            <li class="nav-item" onclick="app.navigate('shipping')">📦 発送管理</li>
            <li class="nav-item" onclick="app.navigate('settings')">⚙️ 設定</li>
            <li class="nav-item" onclick="app.navigate('data-management')">💾 データ管理</li>
        </ul>
    </div>
    <div class="main-content">
        <div class="header">
            <div id="breadcrumb" style="font-size: 14px; color: var(--text-sub);">ホーム / ダッシュボード</div>
            <div id="vol-banner"
                style="background:var(--primary-light); color:var(--primary); padding:8px 16px; border-radius:8px; font-weight:700;">
                Vol.25</div>
        </div>
        <div id="app-root" class="content-area"></div>
    </div>
    <div id="modal-overlay" class="modal-overlay" onclick="ui.closeModal()">
        <div class="modal" id="modal-content" onclick="event.stopPropagation()"></div>
    </div>

    <script>
        const DB_KEY = 'hrr_system_v2';
        const app = {
            state: {},
            currentPage: 'dashboard',
            init() {
                const defaults = {
                    currentVol: { vol: 25, year: 2026, season: '春' },
                    supporters: [], advertisers: [], contributors: [], donors: [], inventory: [],
                    settings: { 
                        orgName: '動物保護団体ヨンナナ',
                        address: '〒779-3132 徳島県徳島市一宮町東丁355-5',
                        bankInfo: { 
                            bank: 'ゆうちょ銀行', branch: '六二八', account: '1710324', 
                            name: 'ドウブツホゴダンタイヨンナナ', symbol: '16230', number: '17103241' 
                        } 
                    }
                };
                try {
                    const saved = localStorage.getItem(DB_KEY);
                    this.state = saved ? JSON.parse(saved) : {};
                } catch (e) {
                    console.error('Data Load Error:', e);
                    this.state = {};
                }
                this.state = Object.assign(defaults, this.state);
                // 階層が深いオブジェクトの補完
                if(!this.state.donors) this.state.donors = [];
                if(!this.state.advertisers) this.state.advertisers = [];
                if(!this.state.contributors) this.state.contributors = [];
                if(!this.state.settings) this.state.settings = defaults.settings;
                if(!this.state.settings.bankInfo) this.state.settings.bankInfo = defaults.settings.bankInfo;
                if(!this.state.settings.orgName) this.state.settings.orgName = defaults.settings.orgName;
                if(!this.state.settings.address) this.state.settings.address = defaults.settings.address;
                if(!this.state.settings.bankInfo.symbol) {
                    Object.assign(this.state.settings.bankInfo, defaults.settings.bankInfo);
                }
            },
            save() { 
                try {
                    localStorage.setItem(DB_KEY, JSON.stringify(this.state)); 
                } catch (e) {
                    alert('【警告】データの保存に失敗しました。ブラウザの容量不足の可能性があります。\n' + e.message);
                }
            },
            navigate(page) { this.currentPage = page; ui.render(); }
        };
        app.init();

        const actions = {
            exportJSON() {
                const data = JSON.stringify(app.state, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                const now = new Date().toISOString().split('T')[0];
                link.download = `hrr_system_backup_${now}.json`;
                link.click();
            },
            importJSON() {
                const file = document.getElementById('json-file').files[0];
                if(!file) return alert('ファイルを選択してください');
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const json = JSON.parse(e.target.result);
                        if(confirm('現在のデータがすべて上書きされます。よろしいですか？')) {
                            app.state = json;
                            app.save();
                            ui.render();
                            alert('復元が完了しました');
                        }
                    } catch (err) {
                        alert('不正なファイル形式です');
                    }
                };
                reader.readAsText(file);
            },
            importLabelsCSV() {
                const file = document.getElementById('labels-csv-file').files[0];
                if(!file) return alert('ファイルを選択してください');
                const reader = new FileReader();
                reader.onload = (e) => {
                    const rows = e.target.result.split('\n').filter(l => l.trim()).map(l => l.split(',').map(c => c.trim().replace(/^"|"$/g, '')));
                    const data = rows.slice(1);
                    let count = 0;
                    data.forEach(r => {
                        const [cat, zip, addr, name, kuchi, notes] = r;
                        if(!name) return;
                        const cleanName = name.replace(/ (様|御中)$/, '');
                        const kuchiNum = parseInt(kuchi) || 1;
                        if(cat === 'サポーター') {
                            let s = app.state.supporters.find(x => x.name === cleanName);
                            if(s) { s.zip = zip; s.address = addr; s.kuchi = kuchiNum; }
                            else { app.state.supporters.push({ id: Date.now()+Math.random(), name: cleanName, zip, address: addr, kuchi: kuchiNum, history: [], gifts: '' }); }
                        } else if(cat === '広告主') {
                            if(!app.state.advertisers.find(x => x.name === cleanName)) {
                                app.state.advertisers.push({ id: Date.now()+Math.random(), name: cleanName, zip, address: addr, needsMailing: true, isListedForCurrent: true });
                            }
                        } else if(cat === '支援者') {
                            if(!app.state.donors.find(x => x.name === cleanName)) {
                                app.state.donors.push({ id: Date.now()+Math.random(), name: cleanName, zip, address: addr, kuchi: kuchiNum, targetVol: app.state.currentVol.vol, notes });
                            }
                        }
                        count++;
                    });
                    app.save(); ui.render(); alert(`${count}件のデータを復元・更新しました。`);
                };
                reader.readAsText(file, 'utf-8');
            },
            isCurrentlyActive(s) {
                const cur = app.state.currentVol.vol;
                return s.history.some(h => h.paid && cur >= h.vol && cur < (h.vol + (h.duration || 4)));
            },
            getRemainingIssues(s) {
                const cur = app.state.currentVol.vol;
                let maxExpiry = 0;
                s.history.forEach(h => { if (h.paid) { const exp = h.vol + (h.duration || 4); if (exp > maxExpiry) maxExpiry = exp; } });
                return Math.max(0, maxExpiry - cur);
            },
            getSeasonColor(vol) {
                const seasons = ['春', '夏', '秋', '冬'];
                // Vol.1(春), 2(夏), 3(秋), 4(冬)
                const s = seasons[(vol - 1) % 4];
                if (s === '春') return 'block-spring';
                if (s === '夏') return 'block-summer';
                if (s === '秋') return 'block-autumn';
                return 'block-winter';
            },
            calcStartVol(dateStr) {
                if (!dateStr) return app.state.currentVol.vol;
                const date = new Date(dateStr.replace(/\//g, '-'));
                if (isNaN(date.getTime())) return app.state.currentVol.vol;

                const year = date.getFullYear();
                const m = date.getMonth() + 1;
                const d = date.getDate();

                // ユーザーのルール案 (15日を境目にする場合が多い)
                // 1/15~4/14: 春, 4/15~7/14: 夏, 7/15~10/14: 秋, 10/15~1/14: 冬
                let q = 0;
                const val = m * 100 + d;
                if (val >= 115 && val <= 414) q = 1;      // 春
                else if (val >= 415 && val <= 714) q = 2; // 夏
                else if (val >= 715 && val <= 1014) q = 3; // 秋
                else q = 4; // 冬 (10/15〜1/14)

                let yShift = year - 2020;
                if (m === 1 && d < 15) yShift--; // 1月前半は前年の冬号扱い

                return yShift * 4 + q;
            },
            recordPayment(id) {
                const s = app.state.supporters.find(x => x.id === id);
                const amount = (s.kuchi || 1) * 5000;
                // 入金日に基づいて開始号を決定
                const today = new Date().toISOString().split('T')[0];
                let startVol = this.calcStartVol(today);

                // すでに履歴がある場合は、最後の終了号から開始
                if (s.history.length > 0) {
                    const last = s.history[s.history.length - 1];
                    startVol = Math.max(startVol, last.vol + last.duration);
                }

                s.history.push({
                    vol: startVol,
                    paid: true,
                    paidDate: today,
                    amount: amount,
                    duration: 4,
                    renewalRound: s.history.filter(h => h.paid).length + 1
                });
                s.amount = amount;
                app.save(); ui.render(); this.editSupporter(id);
            },
            deleteHistory(sid, hidx) {
                if (!confirm('この入金履歴を削除しますか？')) return;
                const s = app.state.supporters.find(x => x.id === sid);
                s.history.splice(hidx, 1);
                // 更新回数を振り直し
                let count = 0;
                s.history.forEach(h => { if (h.paid) { count++; h.renewalRound = count; } });
                app.save(); ui.render(); this.showHistory(sid);
            },
            isFinalIssue(s) {
                return this.getRemainingIssues(s) === 1;
            },
            isRecentlyExpired(s) {
                const cur = app.state.currentVol.vol;
                const remaining = this.getRemainingIssues(s);
                if (remaining > 0) return false;
                // 最大の終了号が currentVol - 1 なら「直近」
                let maxExpiry = 0;
                s.history.forEach(h => { if (h.paid) { const exp = h.vol + h.duration; if (exp > maxExpiry) maxExpiry = exp; } });
                return maxExpiry === cur;
            },
            addSupporter() {
                const id = Date.now();
                const nextNo = Math.max(0, ...app.state.supporters.map(s => parseInt(s.no) || 0)) + 1;
                app.state.supporters.push({ id, no: nextNo, name: '新規登録者', zip: '', address: '', phone: '', kuchi: 1, amount: 5000, history: [], gifts: '' });
                app.save(); this.editSupporter(id);
            },
            editSupporter(id) {
                const s = app.state.supporters.find(x => x.id === id);
                const remaining = this.getRemainingIssues(s);
                const renewalCount = s.history.filter(h => h.paid).length;
                let html = `<span class="close-btn" onclick="ui.closeModal()">&times;</span><h2>${s.name} 様 詳細</h2>
                    <div class="form-grid">
                        <div class="form-group"><label>会員No</label><input type="text" value="${s.no || ''}" oninput="actions.updateS(${id},'no',this.value)"></div>
                        <div class="form-group"><label>氏名</label><input type="text" value="${s.name}" oninput="actions.updateS(${id},'name',this.value)"></div>
                        <div class="form-group"><label>郵便番号</label><input type="text" value="${s.zip || ''}" placeholder="771-0139" oninput="actions.updateS(${id},'zip',this.value)"></div>
                        <div class="form-group"><label>連絡先</label><input type="text" value="${s.phone || ''}" placeholder="088-665-5965" oninput="actions.updateS(${id},'phone',this.value)"></div>
                        <div class="form-group" style="grid-column:span 2;"><label>住所</label><input type="text" value="${s.address}" oninput="actions.updateS(${id},'address',this.value)"></div>
                        <div class="form-group"><label>口数 (1口5,000円)</label><input type="number" value="${s.kuchi}" oninput="actions.updateS(${id},'kuchi',this.value)"></div>
                        <div class="form-group"><label>1口5,000円での入金額</label><input type="number" value="${s.amount || 5000}" oninput="actions.updateS(${id},'amount',this.value)"></div>
                        <div class="form-group" style="grid-column:span 2;"><label>記念品履歴 (何を送ったかメモ)</label><input type="text" value="${s.gifts || ''}" placeholder="例: クリアファイル, ステッカー" oninput="actions.updateS(${id},'gifts',this.value)"></div>
                    </div>
                    <div class="card" style="background:#f0f7ff; margin-top:20px;">
                        <h3>購読・更新状況の調整 (タイムラインに反映)</h3>
                        <p style="font-size:12px; color:var(--text-sub); margin-bottom:10px;">現在の発送開始時期や累計回数を手動で変更できます。</p>
                        <div class="form-grid">
                            <div class="form-group"><label>累計更新回数</label><input type="number" value="${renewalCount}" onchange="actions.updateRound(${id}, this.value)"></div>
                            <div class="form-group"><label>現在の発送開始号 (Year/Season)</label>
                                <div style="display:flex; gap:5px;">
                                    <input type="number" value="${actions.getVolYear(s)}" style="width:70px;" onchange="actions.updateStartYear(${id}, this.value)">年
                                    <select style="flex:1;" onchange="actions.updateStartSeason(${id}, this.value)">
                                        ${['春', '夏', '秋', '冬'].map(sn => `<option value="${sn}" ${actions.getVolSeason(s) === sn ? 'selected' : ''}>${sn}号</option>`).join('')}
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div style="margin-top:15px; display:flex; gap:10px;">
                            <button class="btn btn-primary" onclick="actions.recordPayment(${id})">+ 4回分(1年)入金記録</button>
                            <button class="btn btn-outline" onclick="actions.showHistory(${id})">入金履歴・個別削除</button>
                        </div>
                    </div>
                    <div style="margin-top:20px; text-align:right;">

                        t.kuchi || 1,

                        <div class="form-group"><label>現在発行号 (Vol)</label><input type="number" id="cfg-vol" value="${app.state.currentVol.vol}"></div>
                    </div>
                    <button class="btn btn-primary" onclick="actions.saveSettings()">全ての変更を保存</button>`;
            },
            openModal(html) { document.getElementById('modal-content').innerHTML = html; document.getElementById('modal-overlay').classList.add('open'); },
            closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
        };

        window.onload = () => ui.render();
    </script>
</body>

</html>
