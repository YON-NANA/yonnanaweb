<!DOCTYPE html>
<html lang="ja">

<head>
  <script>
  window.deferredPrompt = window.deferredPrompt || null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    window.deferredPrompt = e;
    console.log('⚡ Early beforeinstallprompt captured!');
  });
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>この子について問合わせる - 動物保護団体ヨンナナ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=1.8">
    <meta name="description" content="保護犬・保護猫についてのお問い合わせフォームです。気になる子がいましたら、お気軽にお問い合わせください。">
    <link rel="icon" type="image/gif" href="assets/images/logo_v2.gif">
    <style>
        .inquiry-page {
            padding: 120px 0 80px;
            background-color: var(--color-bg);
        }

        .inquiry-container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: var(--shadow-md);
        }

        .page-title {
            font-size: 1.8rem;
            color: var(--color-primary);
            margin-bottom: 5px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--color-text);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #E0DCD8;
            border-radius: 12px;
            font-size: 1rem;
            font-family: var(--font-body);
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(139, 168, 136, 0.1);
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background-color: transparent;
            color: var(--color-primary);
            border: 2px solid var(--color-primary);
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .submit-btn:hover {
            background-color: var(--color-primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--color-primary-dark);
        }

        .required {
            color: #e74c3c;
            margin-left: 4px;
        }
    </style>
</head>

<body>
    <div class="inquiry-page">
        <div class="inquiry-container">
            <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px;">
                <img src="assets/images/fujimoto_avatar.png" alt="藤本"
                    style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--color-primary);">
                <div>
                    <h1 class="page-title">この子について問合わせる</h1>
                    <p style="color: var(--color-text-light); margin: 0;">気になることがあれば、お気軽にお問い合わせください</p>
                </div>
            </div>

            <div
                style="background-color: #f9f7f2; padding: 25px; border-radius: 15px; margin-bottom: 30px; border-left: 5px solid var(--color-primary);">
                <p style="line-height: 1.8; margin: 0;">
                    <strong>こんにちは！</strong><br>
                    気になる子についてのご質問やご相談を承ります。性格のこと、健康状態のこと、実際に会ってみたいなど、どんなことでもお気軽にお聞きください。以下の質問にお答えいただければ、スムーズにご対応できます。
                </p>
            </div>

            <form id="inquiryForm">
                <div class="form-group">
                    <label><i class="fas fa-user"
                            style="margin-right: 8px; color: var(--color-primary);"></i>お名前をお聞かせください<span
                            class="required">*</span></label>
                    <input type="text" name="name" placeholder="例：山田 太郎" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-envelope"
                            style="margin-right: 8px; color: var(--color-primary);"></i>メールアドレスを教えてください<span
                            class="required">*</span></label>
                    <input type="email" name="email" placeholder="例：example@email.com" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-phone"
                            style="margin-right: 8px; color: var(--color-primary);"></i>お電話番号を教えてください<span
                            class="required">*</span></label>
                    <input type="tel" name="phone" placeholder="例：090-1234-5678" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-paw"
                            style="margin-right: 8px; color: var(--color-primary);"></i>気になる子の名前（わかる場合）</label>
                    <input type="text" name="animalName" placeholder="例：ぼー">
                </div>

                <div class="form-group">
                    <label><i class="fas fa-comment-dots"
                            style="margin-right: 8px; color: var(--color-primary);"></i>どんなことが気になりますか？<span
                            class="required">*</span></label>
                    <textarea name="message" placeholder="例：この子の性格についてもっと詳しく知りたい、実際に会ってみたい、他の動物との相性が気になる、など"
                        required></textarea>
                </div>

                <button type="submit" class="submit-btn">送信する</button>
            </form>

            <a href="index.html#foster" class="back-link"><i class="fas fa-arrow-left"></i> 里親募集ページに戻る</a>
        </div>
    </div>

    <script>
        document.getElementById('inquiryForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const submitBtn = this.querySelector('.submit-btn');
            const originalBtnText = submitBtn.innerText;
            submitBtn.innerText = '送信中...';
            submitBtn.disabled = true;

            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            data.sheetName = 'inquiry'; // 問い合わせ用シート名

            // Google Apps Script URL
            const scriptURL = 'https://script.google.com/macros/s/AKfycbxdLZVk2S8JJFq6wiNa7O1mH9tyYG4SUeZoxp2VxevUKJv8D2m22auWOQf7FDK71Ybs/exec';

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(data)
            })
                .then(() => {
                    alert('お問い合わせありがとうございます！\n内容を確認次第、ご連絡させていただきます。');
                    this.reset();
                    submitBtn.innerText = originalBtnText;
                    submitBtn.disabled = false;
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('送信に失敗しました。時間をおいて再度お試しいただくか、直接メールでお問い合わせください。');
                    submitBtn.innerText = originalBtnText;
                    submitBtn.disabled = false;
                });
        });
    </script>
</body>

</html>
