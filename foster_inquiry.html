        .back-link {

            margin-top: 30px;
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

            color: var(--color-primary-dark);
        }

        .required {

<body>
    <div class="inquiry-page">

    <script>
        document.getElementById('inquiryForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const submitBtn = this.querySelector('.submit-btn');
            const originalBtnText = submitBtn.innerText;
            submitBtn.innerText = '騾∽ｿ｡荳ｭ...';
            submitBtn.disabled = true;

            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            data.sheetName = 'inquiry'; // 蝠上＞蜷医ｏ縺帷畑繧ｷ繝ｼ繝亥錐

            // Google Apps Script URL
            const scriptURL = 'https://script.google.com/macros/s/AKfycbxdLZVk2S8JJFq6wiNa7O1mH9tyYG4SUeZoxp2VxevUKJv8D2m22auWOQf7FDK71Ybs/exec';

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(data)
            })
                .then(() => {
                    alert('縺雁撫縺・粋繧上○縺ゅｊ縺後→縺・＃縺悶＞縺ｾ縺呻ｼ―n蜀・ｮｹ繧堤｢ｺ隱肴ｬ｡隨ｬ縲√＃騾｣邨｡縺輔○縺ｦ縺・◆縺縺阪∪縺吶・);
                    this.reset();
                    submitBtn.innerText = originalBtnText;
                    submitBtn.disabled = false;
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('騾∽ｿ｡縺ｫ螟ｱ謨励＠縺ｾ縺励◆縲よ凾髢薙ｒ縺翫＞縺ｦ蜀榊ｺｦ縺願ｩｦ縺励＞縺溘□縺上°縲∫峩謗･繝｡繝ｼ繝ｫ縺ｧ縺雁撫縺・粋繧上○縺上□縺輔＞縲・);
                    submitBtn.innerText = originalBtnText;
                    submitBtn.disabled = false;
                });
        });
    </script>
